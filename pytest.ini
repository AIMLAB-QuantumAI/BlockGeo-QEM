[pytest]
# Only tests/ holds pytest tests. src/test_mpdo.py and src/test_sample_blocks.py are diagnostic scripts that need the
# full simulated data set and are not collected.
testpaths = tests
# Test modules are imported by file location, so tests/test_mpdo.py never clashes with src/test_mpdo.py.
addopts = --import-mode=importlib
